<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Game-Bank | Авторизация</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .toggle-link { text-align: center; margin-top: 15px; color: #007bff; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="formTitle">Вход в Банк</h2>
    <input type="text" id="username" placeholder="Имя пользователя">
    <input type="password" id="password" placeholder="Пароль">
    <input type="email" id="email" placeholder="Email (только для регистрации)" style="display: none;">
    <button onclick="handleSubmit()" id="submitBtn">Войти</button>
    <div class="toggle-link" onclick="toggleForm()" id="toggleText">Нет аккаунта? Зарегистрироваться</div>
</div>

<script>
    let isLogin = true;

    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('formTitle').innerText = isLogin ? 'Вход в Банк' : 'Регистрация';
        document.getElementById('submitBtn').innerText = isLogin ? 'Войти' : 'Создать аккаунт';
        document.getElementById('email').style.display = isLogin ? 'none' : 'block';
        document.getElementById('toggleText').innerText = isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
    }

    async function handleSubmit() {
        const name = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const gmail = document.getElementById('email').value;

        const url = isLogin ? '/api/users/login' : '/api/users/register';
        const bodyData = isLogin ? { name, password } : { name, password, gmail };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });

            const data = await response.json();

            if (response.ok) {
                alert(isLogin ? 'Вход выполнен!' : 'Регистрация успешна!');
                window.location.href = '/dashboard.html';
            } else {
                alert('Ошибка: ' + (data.message || 'Не удалось выполнить действие'));
            }
        } catch (err) {
            alert('Ошибка сети: ' + err.message);
        }
    }
</script>
</body>
</html>
